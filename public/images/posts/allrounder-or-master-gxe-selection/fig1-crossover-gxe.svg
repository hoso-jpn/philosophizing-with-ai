<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img"
     aria-labelledby="fig1title fig1desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="fig1title">クロスオーバー型の遺伝子型×環境交互作用</title>
  <desc id="fig1desc">品種Aは4環境すべてで収量8。品種BはE1・E2で12、E3・E4で4。平均収量はどちらも8だが、E2とE3のあいだで品種順位が逆転する。</desc>

  <style><![CDATA[
    .fig { font-family: "Noto Sans JP", "Noto Sans CJK JP", sans-serif; }
    .ink { fill: #23262a; }
    .ink-soft { fill: #6b7178; }
    .axis { stroke: #9aa1a8; stroke-width: 1.2; }
    .grid { stroke: #dfe3e7; stroke-width: 1; }
    .lead { stroke: #6b7178; stroke-width: 1; }
    .gA-s { stroke: #1d5f7a; }
    .gA-f { fill: #1d5f7a; }
    .gB-s { stroke: #b8611c; }
    .gB-f { fill: #b8611c; }
    .line { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  ]]></style>
  <g class="fig">
    <line class="grid" x1="96" y1="240" x2="560" y2="240"/>
    <line class="grid" x1="96" y1="160" x2="560" y2="160"/>
    <line class="grid" x1="96" y1="80" x2="560" y2="80"/>
    <line class="axis" x1="96" y1="40" x2="96" y2="320"/>
    <line class="axis" x1="96" y1="320" x2="560" y2="320"/>
    <g class="ink-soft" font-size="16" text-anchor="end">
      <text x="82" y="326">0</text><text x="82" y="246">4</text><text x="82" y="166">8</text><text x="82" y="86">12</text>
    </g>
    <text class="ink-soft" font-size="16" text-anchor="middle" transform="translate(36,180) rotate(-90)">収量（相対値）</text>
    <g class="ink-soft" font-size="17" text-anchor="middle">
      <text x="150" y="348">E1</text><text x="280" y="348">E2</text><text x="410" y="348">E3</text><text x="540" y="348">E4</text><text x="345" y="382">試験環境</text>
    </g>
    <polyline class="line gB-s" points="150,80 280,80 410,240 540,240"/>
    <g class="gB-f"><rect x="145" y="75" width="10" height="10"/><rect x="275" y="75" width="10" height="10"/><rect x="405" y="235" width="10" height="10"/><rect x="535" y="235" width="10" height="10"/></g>
    <polyline class="line gA-s" points="150,160 280,160 410,160 540,160"/>
    <g class="gA-f"><circle cx="150" cy="160" r="5.5"/><circle cx="280" cy="160" r="5.5"/><circle cx="410" cy="160" r="5.5"/><circle cx="540" cy="160" r="5.5"/></g>
    <circle cx="345" cy="160" r="7" fill="none" stroke="#6b7178" stroke-width="1.4"/>
    <line class="lead" x1="352" y1="153" x2="372" y2="124"/>
    <text class="ink" font-size="17" font-weight="600" x="370" y="114">クロスオーバー（順位逆転）</text>
    <g text-anchor="start">
      <text class="gA-f" font-size="18" font-weight="600" x="556" y="152">品種A</text><text class="ink-soft" font-size="14" x="556" y="173">広域適応型</text>
      <text class="gB-f" font-size="18" font-weight="600" x="556" y="232">品種B</text><text class="ink-soft" font-size="14" x="556" y="253">特異的適応型</text>
    </g>
    <text class="ink" font-size="15" x="112" y="62">平均はどちらも 8</text>
  </g>
</svg>