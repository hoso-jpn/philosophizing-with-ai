name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `npm test` は node:test に .ts を直接読ませる（type stripping）。
          # これが flag 無しで動くのは 22.18.0 以降で、22.12.0 では全 test file が
          # ERR_UNKNOWN_FILE_EXTENSION になり 0 pass / 17 fail になる（実測）。
          # package.json の engines と揃えること。
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:fixture
      - run: npm run test:fixture-output
      - name: Production-like build (credentials configured repositories only)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [ -n "$NOTION_API_KEY" ] && [ -n "$NOTION_DATABASE_ID" ]; then
            npm run build
          else
            echo "Notion credentials are not configured; credential-free fixture build already passed."
          fi
